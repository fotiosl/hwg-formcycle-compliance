version: '3.8'

services:
  hwg-compliance-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hwg-formcycle-checker
    restart: unless-stopped
    # Nur lokal binden; Zugriff ausschließlich über den authentifizierenden Reverse Proxy (nginx.conf)
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - PYTHONDONTWRITEBYTECODE=1
      - LLM_API_BASE=${LLM_API_BASE:-https://chat-ai.academiccloud.de/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash-0731}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Optionales Ersatzmodell am selben Endpunkt, falls das Hauptmodell nicht antwortet
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      # Kommagetrennte Liste zusätzlich erlaubter LLM-Endpunkte (z. B. interner Ollama-Server)
      - LLM_ALLOWED_API_BASES=${LLM_ALLOWED_API_BASES:-}
      # Modell eigener Inferenzserver in der Auswahl des Dashboards und Zeitlimit je Modellanfrage (Sekunden)
      - LLM_LOCAL_MODEL=${LLM_LOCAL_MODEL:-qwen3.8:27b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-20971520}
    security_opt:
      - no-new-privileges:true
    read_only: true
