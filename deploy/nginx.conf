# ==============================================================================
# Nginx-Konfiguration für den HWG-Intranet-Server (Reverse Proxy vor dem Container)
# Der Prüf-Server selbst hat keine Benutzerverwaltung. Der Zugriff muss deshalb hier
# eingeschränkt werden (Hochschul-SSO/Shibboleth, LDAP-Basic-Auth oder IP-Freigabe).
# ==============================================================================
server {
    listen 443 ssl http2;
    server_name formulare-check.intern.example;

    ssl_certificate     /etc/ssl/certs/hwg-lu-wildcard.crt;
    ssl_certificate_key /etc/ssl/private/hwg-lu-wildcard.key;

    # Upload-Limit passend zu MAX_UPLOAD_BYTES (20 MB)
    client_max_body_size 20M;

    # Beispiel: Zugriff nur aus dem Verwaltungsnetz und mit Anmeldung
    # allow 10.0.0.0/8;
    # deny all;
    auth_basic           "Formcycle Compliance-Prüfung";
    auth_basic_user_file /etc/nginx/.htpasswd_compliance;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
